<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Os Guri do Fut</title><style>:root{--bg:#0d0716;--card:#1a102b;--card2:#261640;--line:#3d2861;--txt:#f8f5ff;--mut:#baa9d3;--a:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#0b0612,#170d27);color:var(--txt);font:14px system-ui,Arial}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.brand{font-size:28px;font-weight:900}.steps{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.step{padding:8px 10px;background:var(--card2);border-radius:999px;color:var(--mut)}.step.on{background:var(--a);color:#fff}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}label{display:block;color:var(--mut);margin:8px 0}input,select{width:100%;padding:10px;background:#10091b;border:1px solid var(--line);border-radius:10px;color:#fff}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--a);color:#fff}.secondary{background:var(--card2);color:#fff;border:1px solid var(--line)}.shirt{width:150px;height:180px;margin:22px auto;background:var(--kit,#7c3aed);border-radius:24px 24px 35px 35px;position:relative;border:5px solid #ffffff25}.shirt:before,.shirt:after{content:"";position:absolute;top:12px;width:45px;height:72px;background:var(--kit,#7c3aed)}.shirt:before{left:-31px;transform:rotate(24deg)}.shirt:after{right:-31px;transform:rotate(-24deg)}.crest{position:absolute;top:26px;left:24px;width:38px;height:38px;object-fit:contain}.master{position:absolute;top:82px;left:50%;transform:translateX(-50%);font-weight:900;white-space:nowrap}.clubtxt{position:absolute;bottom:18px;width:100%;text-align:center;font-weight:900}.offer{background:var(--card2);padding:12px;border-radius:13px;margin:9px 0}.ok{padding:10px;border-left:4px solid #a78bfa;background:#2c194b;border-radius:10px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{flex:1;min-width:120px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{background:var(--card2);padding:11px;border-radius:12px}.kpi b{display:block;font-size:20px}.page{margin-top:12px}.list{background:#10091b;border-radius:12px;padding:10px}.item{padding:9px;border-bottom:1px solid #ffffff12}.mut{color:var(--mut)}@media(max-width:720px){.grid,.kpis{grid-template-columns:1fr}.brand{font-size:23px}}</style></head><body><div class="wrap"><div class="brand">⚽ OS GURI DO FUT</div><section id="pre" class="card"><h2>Nova carreira</h2><div class="steps"><span class="step on" id="s1">1 Identidade</span><span class="step" id="s2">2 Uniforme</span><span class="step" id="s3">3 Patrocínio</span><span class="step" id="s4">4 Temporada</span></div><div id="identity"><div class="grid"><div><label>Nome do clube<input id="club" value="Guri FC"></label><label>Cidade<input id="city" value="Pelotas"></label><label>Estádio<input id="stadium" value="Arena dos Guri"></label><label>Escudo<input id="logo" type="file" accept="image/*"></label></div><div><div class="shirt" id="shirt"><img id="crest" class="crest hidden"><span id="abbr" class="crest">GF</span><span id="master" class="master">SEM MASTER</span><span id="clubtxt" class="clubtxt">GURI FC</span></div></div></div><button id="toKit" class="btn primary">Ir para Uniforme →</button></div><div id="kit" class="hidden"><div class="grid"><div><label>Cor principal<input id="c1" type="color" value="#7c3aed"></label><label>Cor secundária<input id="c2" type="color" value="#ffffff"></label><label>Modelo<select id="pattern"><option>Lisa</option><option>Listras verticais</option><option>Faixa diagonal</option></select></label></div><div><div class="shirt" id="shirt2"><img id="crest2" class="crest hidden"><span id="abbr2" class="crest">GF</span><span id="master2" class="master">SEM MASTER</span><span id="clubtxt2" class="clubtxt">GURI FC</span></div></div></div><div class="row"><button id="back1" class="btn secondary">← Voltar</button><button id="toSponsor" class="btn primary">Escolher Patrocínio →</button></div></div><div id="sponsor" class="hidden"><h3>Propostas</h3><div id="offers"></div><div id="status" class="ok">Escolhe uma empresa para liberar a temporada.</div><div class="row" style="margin-top:10px"><button id="back2" class="btn secondary">← Uniforme</button><button id="start" class="btn primary" disabled style="opacity:.45">🔒 Iniciar temporada</button></div></div></section><section id="game" class="hidden"><div class="card"><div class="nav"><button class="btn primary" data-page="home">Central</button><button class="btn secondary" data-page="squad">Elenco</button><button class="btn secondary" data-page="finance">Finanças</button><button class="btn secondary" data-page="fans">Ingressos</button><button class="btn secondary" data-page="match">Jogo</button></div></div><div id="home" class="page card"><h2 id="gname"></h2><div class="kpis"><div class="kpi">Divisão<b>Série B Gaúcha</b></div><div class="kpi">Caixa<b id="cash">R$ 0</b></div><div class="kpi">Torcida<b id="fan">1.800</b></div><div class="kpi">Moral<b>70</b></div></div><p id="next" class="ok" style="margin-top:12px"></p></div><div id="squad" class="page card hidden"><h2>Elenco</h2><div id="plist" class="list"></div></div><div id="finance" class="page card hidden"><h2>Finanças</h2><div id="ledger" class="list"></div></div><div id="fans" class="page card hidden"><h2>Ingressos</h2><label>Preço do ingresso<input id="ticket" type="number" value="20"></label><button id="forecast" class="btn primary">Ver previsão</button><div id="crowd" class="ok" style="margin-top:10px"></div></div><div id="match" class="page card hidden"><h2>Partida</h2><div id="score" style="font-size:40px;text-align:center;font-weight:900">0 × 0</div><div id="clock" style="text-align:center;font-size:20px">0'</div><button id="play" class="btn primary">Começar jogo</button><div id="log" class="list" style="margin-top:10px;max-height:280px;overflow:auto"></div></div></section></div><script>const $=s=>document.querySelector(s),money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});const offers=[{name:'Chocolates Imperial',slot:'Master • frente',up:38000,mo:9500},{name:'Construtora Pampa',slot:'Manga',up:18000,mo:5500},{name:'Mercado Avenida',slot:'Costas',up:12000,mo:4000}];const roster=[['Emerson','GOL',66],['Rodrigo','ZAG',65],['Nicolas','ZAG',64],['Arthur','LD',62],['Fernandes','LE',61],['Eduardo','VOL',67],['Silva','MC',64],['Robinho','MEI',68],['Flávio','PD',63],['Júnior','PE',64],['Rafael Costa','ATA',69],['Guilherme Tavares','ATA',62]];let S={cash:120000,sponsor:null,ticket:20,fans:1800,club:'Guri FC',city:'Pelotas',stadium:'Arena dos Guri',ledger:[],minute:0,us:0,them:0,timer:null};function step(n){[1,2,3,4].forEach(i=>$('#s'+i).classList.toggle('on',i===n))}$('#club').oninput=e=>{const v=e.target.value||'Guri FC';$('#clubtxt').textContent=$('#clubtxt2').textContent=v.toUpperCase();let a=v.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();$('#abbr').textContent=$('#abbr2').textContent=a};$('#logo').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{['#crest','#crest2'].forEach(id=>{$(id).src=ev.target.result;$(id).classList.remove('hidden')});$('#abbr').classList.add('hidden');$('#abbr2').classList.add('hidden')};r.readAsDataURL(f)};$('#c1').oninput=e=>{$('#shirt').style.setProperty('--kit',e.target.value);$('#shirt2').style.setProperty('--kit',e.target.value)};$('#toKit').onclick=()=>{$('#identity').classList.add('hidden');$('#kit').classList.remove('hidden');step(2)};$('#back1').onclick=()=>{$('#kit').classList.add('hidden');$('#identity').classList.remove('hidden');step(1)};$('#toSponsor').onclick=()=>{$('#kit').classList.add('hidden');$('#sponsor').classList.remove('hidden');step(3)};$('#back2').onclick=()=>{$('#sponsor').classList.add('hidden');$('#kit').classList.remove('hidden');step(2)};function renderOffers(){$('#offers').innerHTML=offers.map((o,i)=>`<div class="offer"><b>${o.name}</b><div class="mut">${o.slot} • ${money(o.up)} de luvas + ${money(o.mo)}/mês</div><button class="btn primary accept" data-i="${i}" ${S.sponsor===i?'disabled':''}>${S.sponsor===i?'✅ Fechado':'Aceitar proposta'}</button></div>`).join('');document.querySelectorAll('.accept').forEach(b=>b.onclick=()=>accept(+b.dataset.i))}function accept(i){S.sponsor=i;const o=offers[i];S.cash+=o.up;S.ledger.unshift(`+ ${money(o.up)} • luvas ${o.name}`);$('#master').textContent=$('#master2').textContent=o.name.toUpperCase();$('#status').innerHTML=`✅ <b>${o.name}</b> fechado. ${money(o.up)} entrou no caixa.`;$('#start').disabled=false;$('#start').style.opacity=1;$('#start').textContent='▶️ Iniciar temporada';renderOffers()}renderOffers();$('#start').onclick=()=>{if(S.sponsor===null)return;S.club=$('#club').value||'Guri FC';S.city=$('#city').value||'Pelotas';S.stadium=$('#stadium').value||'Arena dos Guri';$('#pre').classList.add('hidden');$('#game').classList.remove('hidden');step(4);renderGame();window.scrollTo(0,0)};function renderGame(){$('#gname').textContent=S.club;$('#cash').textContent=money(S.cash);$('#fan').textContent=S.fans.toLocaleString('pt-BR');$('#next').textContent=`Próximo jogo: ${S.club} x Farroupilha • ${S.stadium}`;$('#plist').innerHTML=roster.map(p=>`<div class="item"><b>${p[0]}</b> • ${p[1]} • OVR ${p[2]}</div>`).join('');$('#ledger').innerHTML=S.ledger.map(x=>`<div class="item">${x}</div>`).join('')||'<div class="item mut">Sem movimentações</div>'}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));$('#'+b.dataset.page).classList.remove('hidden');document.querySelectorAll('[data-page]').forEach(x=>x.className='btn secondary');b.className='btn primary'});$('#forecast').onclick=()=>{S.ticket=+$('#ticket').value||20;let demand=Math.min(3500,Math.max(500,Math.round(S.fans*(1+(25-S.ticket)/55))));$('#crowd').innerHTML=`Público esperado: <b>${demand}</b> / 3.500<br>Receita bruta estimada: <b>${money(demand*S.ticket)}</b><br><span class="mut">Em jogos decisivos, casa cheia pode ajudar discretamente.</span>`};$('#play').onclick=()=>{clearInterval(S.timer);S.minute=0;S.us=0;S.them=0;$('#log').innerHTML='';$('#play').disabled=true;S.timer=setInterval(()=>{S.minute++;$('#clock').textContent=S.minute+"'";let r=Math.random();if(r<.04){S.us++;$('#log').insertAdjacentHTML('afterbegin',`<div class="item">${S.minute}' ⚽ Gol do ${S.club}!</div>`)}else if(r<.075){S.them++;$('#log').insertAdjacentHTML('afterbegin',`<div class="item">${S.minute}' ❌ Gol do adversário.</div>`)}else if(r<.12){$('#log').insertAdjacentHTML('afterbegin',`<div class="item">${S.minute}' 🎯 Chance perigosa.</div>`)}$('#score').textContent=S.us+' × '+S.them;if(S.minute>=90){clearInterval(S.timer);$('#play').disabled=false;$('#play').textContent='Jogar novamente';S.ledger.unshift(`${S.us>S.them?'+ Vitória':'Resultado'} • ${S.us}x${S.them}`);renderGame()}},160)};</script></body></html>
